<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile · ID10T</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <style>
    :root {
      --bg: #141414;
      --panel: #1c1c1c;
      --line: #2e2e2e;
      --text: #ececec;
      --muted: #9a9a9a;
      --accent: #c8a45a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0 auto;
      max-width: 760px;
      padding: 24px 16px 48px;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.45 system-ui, Segoe UI, sans-serif;
    }
    a { color: var(--accent); }
    .title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 12px;
    }
    h1 { margin: 0; font-size: 22px; }
    .back {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      color: var(--text);
      text-decoration: none;
      font-size: 18px;
    }
    .back .tip {
      display: none;
      position: absolute;
      left: 0;
      top: calc(100% + 8px);
      padding: 4px 8px;
      background: var(--panel);
      color: var(--text);
      border: 1px solid #4a4a4a;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      font-size: 12px;
      white-space: nowrap;
      z-index: 5;
    }
    .back:hover .tip,
    .back:focus-visible .tip { display: block; }
    #add-link, #add-role, #add-project, #add-school,
    .row button { margin-top: 12px; }
    .row label { margin-bottom: 0; }
    .intro { color: var(--muted); margin: 0 0 20px; }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0;
      margin: 0 0 14px;
      overflow: hidden;
    }
    .fold-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0;
      padding: 14px 16px;
      background: transparent;
      color: var(--muted);
      border: 0;
      border-radius: 14px 14px 0 0;
      font: inherit;
      font-size: 13px;
      letter-spacing: 0.06em;
      text-align: left;
      cursor: pointer;
    }
    .fold.collapsed .fold-bar { border-radius: 14px; }
    .fold-bar:hover { background: #242424; }
    .fold-bar i { flex: 0 0 auto; font-size: 12px; transition: transform 0.15s ease; }
    .fold:not(.collapsed) .fold-bar i { transform: rotate(180deg); }
    .fold-body { padding: 0 16px 16px; }
    .fold.collapsed .fold-body { display: none; }
    label { display: block; margin: 8px 0 4px; color: var(--muted); font-size: 13px; }
    input, textarea {
      width: 100%;
      background: #111;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
    }
    textarea { min-height: 38px; resize: none; overflow: hidden; }
    .row { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin: 12px 0 0; }
    button, .linkish {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 6px 12px;
      font: inherit;
      cursor: pointer;
    }
    #save { background: var(--accent); color: #1a1a1a; font-weight: 600; border: 0; }
    #save:disabled { opacity: 0.45; cursor: default; }
    #summary, #skill-entry { margin-top: 12px; }
    .skills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .skill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      background: #d9f5e3;
      color: #145c32;
      border: 1.5px solid #1b7a3a;
      border-radius: 999px;
      padding: 4px 4px 4px 12px;
      line-height: 1.3;
    }
    .skill-name { overflow-wrap: anywhere; }
    .skill button {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      background: transparent;
      color: #1b7a3a;
      border: 0;
      border-radius: 999px;
      padding: 0;
      cursor: pointer;
    }
    .skill button i { font-size: 12px; }
    .skill button .tip {
      display: none;
      position: absolute;
      left: 50%;
      bottom: calc(100% + 6px);
      transform: translateX(-50%);
      padding: 4px 8px;
      background: var(--panel);
      color: var(--text);
      border: 1px solid #4a4a4a;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      font-size: 12px;
      font-weight: 400;
      white-space: nowrap;
      z-index: 5;
      pointer-events: none;
    }
    .skill button:hover,
    .skill button:focus-visible { background: #1b7a3a; color: #f3fff6; }
    .skill button:hover .tip,
    .skill button:focus-visible .tip { display: block; }
    .bar { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    #status { color: var(--muted); min-height: 1.2em; }
  </style>
</head>
<body>
  <header class="title-row">
    <a class="back" href="/" aria-label="Back to Chat">
      <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
      <span class="tip">Back to Chat</span>
    </a>
    <h1>Profile</h1>
  </header>
  <p class="intro">This is your professional background for this device. Another device starts with its own profile. Job application writes the resume and cover letter only from what is saved here. Type it in yourself, or attach a resume in the chat with Update profile and save the result.</p>
  <form id="form">
    <section class="fold collapsed">
      <button type="button" class="fold-bar" aria-expanded="false">
        <span>CONTACT</span>
        <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
      </button>
      <div class="fold-body">
        <label>Name</label><input id="name" autocomplete="name">
        <label>Email</label><input id="email" autocomplete="email">
        <label>Phone</label><input id="phone" autocomplete="tel">
        <label>Location</label><input id="location">
        <div id="links"></div>
        <button type="button" id="add-link">Add link</button>
      </div>
    </section>
    <section class="fold collapsed">
      <button type="button" class="fold-bar" aria-expanded="false">
        <span>SUMMARY</span>
        <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
      </button>
      <div class="fold-body">
        <textarea id="summary"></textarea>
      </div>
    </section>
    <section class="fold collapsed">
      <button type="button" class="fold-bar" aria-expanded="false">
        <span>EXPERIENCE</span>
        <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
      </button>
      <div class="fold-body">
        <div id="experience"></div>
        <button type="button" id="add-role">Add role</button>
      </div>
    </section>
    <section class="fold collapsed">
      <button type="button" class="fold-bar" aria-expanded="false">
        <span>PROJECTS</span>
        <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
      </button>
      <div class="fold-body">
        <div id="projects"></div>
        <button type="button" id="add-project">Add project</button>
      </div>
    </section>
    <section class="fold collapsed">
      <button type="button" class="fold-bar" aria-expanded="false">
        <span>SKILLS</span>
        <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
      </button>
      <div class="fold-body">
        <input id="skill-entry" placeholder="Add a skill, or several separated by commas" autocomplete="off">
        <div id="skills" class="skills"></div>
      </div>
    </section>
    <section class="fold collapsed">
      <button type="button" class="fold-bar" aria-expanded="false">
        <span>EDUCATION</span>
        <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
      </button>
      <div class="fold-body">
        <div id="education"></div>
        <button type="button" id="add-school">Add school</button>
      </div>
    </section>
    <div class="bar">
      <span id="status"></span>
      <button type="submit" id="save" disabled>Save profile</button>
    </div>
  </form>
  <script>
    const linksEl = document.getElementById("links");
    const experienceEl = document.getElementById("experience");
    const projectsEl = document.getElementById("projects");
    const educationEl = document.getElementById("education");
    const skillsEl = document.getElementById("skills");
    const skillEntry = document.getElementById("skill-entry");
    const statusEl = document.getElementById("status");
    const saveEl = document.getElementById("save");
    let profileChanged = false;
    let savedSnapshot = "";

    function field(label, value, key) {
      const wrap = document.createElement("label");
      wrap.textContent = label;
      const input = document.createElement(label === "Description" ? "textarea" : "input");
      input.dataset.key = key;
      input.value = value || "";
      wrap.appendChild(input);
      return wrap;
    }

    function card(parent, pairs, remover) {
      const box = document.createElement("div");
      box.className = "row";
      for (const [label, key, value] of pairs) box.appendChild(field(label, value, key));
      const remove = document.createElement("button");
      remove.type = "button";
      remove.textContent = "Remove";
      remove.addEventListener("click", () => {
        box.remove();
        refreshSave();
      });
      box.appendChild(remove);
      parent.appendChild(box);
      for (const area of box.querySelectorAll("textarea")) fitText(area);
    }

    function fitText(area) {
      if (!area || area.getClientRects().length === 0) return;
      const border = area.offsetHeight - area.clientHeight;
      area.style.height = "auto";
      area.style.height = (area.scrollHeight + border) + "px";
    }

    function fitOpen() {
      for (const section of document.querySelectorAll("section.fold:not(.collapsed)")) {
        for (const area of section.querySelectorAll("textarea")) fitText(area);
      }
    }

    function addLink(item) {
      card(linksEl, [["Title", "title", item.title || ""], ["URL", "url", item.url || ""]]);
    }
    function addRole(item) {
      card(experienceEl, [
        ["Position", "position", item.position],
        ["Company", "company", item.company],
        ["Location", "location", item.location],
        ["Start", "start", item.start],
        ["End", "end", item.end],
        ["Description", "description", item.description],
      ]);
    }
    function addProject(item) {
      card(projectsEl, [["Title", "title", item.title], ["Description", "description", item.description]]);
    }
    function addSkill(name) {
      const text = String(name || "").trim();
      if (!text) return false;
      const chip = document.createElement("span");
      chip.className = "skill";
      const label = document.createElement("span");
      label.className = "skill-name";
      label.textContent = text;
      const remove = document.createElement("button");
      remove.type = "button";
      remove.setAttribute("aria-label", "Remove " + text + " from your skills");
      const icon = document.createElement("i");
      icon.className = "fa-solid fa-xmark";
      icon.setAttribute("aria-hidden", "true");
      const tip = document.createElement("span");
      tip.className = "tip";
      tip.textContent = "Remove " + text + " from your skills";
      remove.append(icon, tip);
      remove.addEventListener("mouseenter", () => placeSkillTip(remove));
      remove.addEventListener("focus", () => placeSkillTip(remove));
      remove.addEventListener("click", () => {
        chip.remove();
        refreshSave();
      });
      chip.append(label, remove);
      skillsEl.appendChild(chip);
      return true;
    }

    function placeSkillTip(button) {
      const tip = button.querySelector(".tip");
      const section = button.closest("section");
      if (!tip || !section) return;
      requestAnimationFrame(() => {
        tip.style.left = "50%";
        tip.style.right = "auto";
        tip.style.transform = "translateX(-50%)";
        const tipBox = tip.getBoundingClientRect();
        const box = section.getBoundingClientRect();
        if (tipBox.right > box.right - 8) {
          tip.style.left = "auto";
          tip.style.right = "0";
          tip.style.transform = "none";
        } else if (tipBox.left < box.left + 8) {
          tip.style.left = "0";
          tip.style.transform = "none";
        }
      });
    }

    function commitSkills() {
      let added = false;
      for (const part of skillEntry.value.split(",")) {
        if (addSkill(part)) added = true;
      }
      skillEntry.value = "";
      if (added) refreshSave();
    }

    function skillNames() {
      return [...skillsEl.querySelectorAll(".skill-name")].map((el) => el.textContent);
    }

    function addSchool(item) {
      card(educationEl, [
        ["School", "school", item.school],
        ["Location", "location", item.location],
        ["Start", "start", item.start],
        ["End", "end", item.end],
        ["Degree", "degree", item.degree],
        ["Specialization", "specialization", item.specialization],
        ["Description", "description", item.description],
      ]);
    }

    function readCards(parent) {
      return [...parent.querySelectorAll(".row")].map((row) => {
        const item = {};
        for (const input of row.querySelectorAll("[data-key]")) item[input.dataset.key] = input.value.trim();
        return item;
      }).filter((item) => Object.values(item).some(Boolean));
    }

    function fill(profile) {
      const contact = profile.contact || {};
      document.getElementById("name").value = contact.name || "";
      document.getElementById("email").value = contact.email || "";
      document.getElementById("phone").value = contact.phone || "";
      document.getElementById("location").value = contact.location || "";
      document.getElementById("summary").value = profile.summary || "";
      skillEntry.value = "";
      skillsEl.innerHTML = "";
      for (const skill of profile.skills || []) addSkill(skill);
      linksEl.innerHTML = "";
      experienceEl.innerHTML = "";
      projectsEl.innerHTML = "";
      educationEl.innerHTML = "";
      for (const item of contact.links || []) addLink(item);
      for (const item of profile.experience || []) addRole(item);
      for (const item of profile.projects || []) addProject(item);
      for (const item of profile.education || []) addSchool(item);
      fitOpen();
      markSaved();
    }

    function cardState(parent) {
      return [...parent.querySelectorAll(".row")].map((row) => {
        const item = {};
        for (const input of row.querySelectorAll("[data-key]")) item[input.dataset.key] = input.value;
        return item;
      });
    }

    function formSnapshot() {
      return JSON.stringify({
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        location: document.getElementById("location").value,
        summary: document.getElementById("summary").value,
        skills: skillNames(),
        links: cardState(linksEl),
        experience: cardState(experienceEl),
        projects: cardState(projectsEl),
        education: cardState(educationEl),
      });
    }

    function refreshSave() {
      profileChanged = formSnapshot() !== savedSnapshot;
      saveEl.disabled = !profileChanged;
    }

    function markSaved() {
      savedSnapshot = formSnapshot();
      profileChanged = false;
      saveEl.disabled = true;
    }

    function watch(el) {
      el.addEventListener("input", (event) => {
        if (event.target && event.target.tagName === "TEXTAREA") fitText(event.target);
        refreshSave();
      });
    }

    for (const section of document.querySelectorAll("section.fold")) {
      const bar = section.querySelector(".fold-bar");
      bar.addEventListener("click", () => {
        const collapsed = section.classList.toggle("collapsed");
        bar.setAttribute("aria-expanded", collapsed ? "false" : "true");
        if (!collapsed) fitOpen();
      });
    }
    watch(document.getElementById("name"));
    watch(document.getElementById("email"));
    watch(document.getElementById("phone"));
    watch(document.getElementById("location"));
    watch(document.getElementById("summary"));
    watch(linksEl);
    watch(experienceEl);
    watch(projectsEl);
    watch(educationEl);

    document.getElementById("add-link").addEventListener("click", () => { addLink({}); refreshSave(); });
    document.getElementById("add-role").addEventListener("click", () => { addRole({}); refreshSave(); });
    document.getElementById("add-project").addEventListener("click", () => { addProject({}); refreshSave(); });
    document.getElementById("add-school").addEventListener("click", () => { addSchool({}); refreshSave(); });
    skillEntry.addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      event.preventDefault();
      commitSkills();
    });

    document.getElementById("form").addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!profileChanged) return;
      statusEl.textContent = "Saving…";
      saveEl.disabled = true;
      const profile = {
        contact: {
          name: document.getElementById("name").value.trim(),
          email: document.getElementById("email").value.trim(),
          phone: document.getElementById("phone").value.trim(),
          location: document.getElementById("location").value.trim(),
          links: readCards(linksEl),
        },
        summary: document.getElementById("summary").value.trim(),
        experience: readCards(experienceEl),
        projects: readCards(projectsEl),
        skills: skillNames(),
        education: readCards(educationEl),
      };
      try {
        const res = await fetch("/update-profile", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ device: deviceId(), profile, merge: false }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          statusEl.textContent = data.error || "Could not save";
          refreshSave();
          return;
        }
        fill(data.profile || profile);
        statusEl.textContent = "Saved";
      } catch (err) {
        statusEl.textContent = String(err && err.message ? err.message : err);
        refreshSave();
      }
    });

    const DEVICE_KEY = "id10t-device-id";
    const DEVICE_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    function deviceId() {
      let id = "";
      try { id = localStorage.getItem(DEVICE_KEY) || ""; } catch (e) {}
      if (!DEVICE_RE.test(id)) {
        id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : "00000000-0000-4000-8000-000000000000";
        try { localStorage.setItem(DEVICE_KEY, id); } catch (e) {}
      }
      return String(id || "").toLowerCase();
    }

    fetch("/read-profile?device=" + encodeURIComponent(deviceId())).then((res) => res.json()).then((data) => {
      if (data && data.profile) fill(data.profile);
    }).catch((err) => { statusEl.textContent = String(err); });
  </script>
</body>
</html>
